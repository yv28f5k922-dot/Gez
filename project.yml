# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# Gez.xcodeproj is generated and not committed; edit this file instead.
name: Gez
options:
  bundleIdPrefix: com.gez
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The map is drawn pixel by pixel on the CPU; keep it fast in Debug runs too.
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The owner's Apple developer team, needed to install on the iPad.
    # Kept here so regenerating the project does not erase it.
    DEVELOPMENT_TEAM: YTL284VK63
    CODE_SIGN_STYLE: Automatic
packages:
  GezCore:
    path: Packages/GezCore
targets:
  GezMac:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: GezCore
    settings:
      base:
        PRODUCT_NAME: Gez
        PRODUCT_BUNDLE_IDENTIFIER: com.gez.game
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Gez
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
    scheme:
      testTargets:
        - GezMacTests
  GezMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: GezMac
      - package: GezCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gez.game.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gez.app/Contents/MacOS/Gez"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GeziPad:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: GezCore
    settings:
      base:
        PRODUCT_NAME: Gez
        PRODUCT_BUNDLE_IDENTIFIER: com.gez.game
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Gez
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
    scheme: {}
