name: Heraldry

# Needs internet (the cloud workspace has none).
# "search" (run by hand): finds Wikimedia Commons candidates per country and force-pushes
#   contact sheets to the heraldry-candidates branch for Claude to review.
# "download" (runs when choices.txt changes): fetches the files chosen in data/heraldry/choices.txt, turns
#   them into PNGs in App/Resources/Heraldry/, and writes the credits list.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "search, check or download"
        default: search
  push:
    branches: [main]
    paths:
      - data/heraldry/choices.txt
      - tools/heraldry/download_arms.py

jobs:
  search:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'search' || inputs.mode == 'check')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/heraldry/search_commons.py /tmp/heraldry_out data/heraldry/${{ inputs.mode == 'check' && 'check' || 'queries' }}.txt
      - name: Push candidates branch
        run: |
          cd /tmp/heraldry_out
          git init -q -b heraldry-candidates
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Heraldry candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" heraldry-candidates

  download:
    if: github.event_name == 'push' || inputs.mode == 'download'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y librsvg2-bin
      - run: pip install pillow
      - run: python3 tools/heraldry/download_arms.py
      - name: Commit arms
        run: |
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          git add App/Resources/Heraldry data/heraldry/credits.json
          git diff --cached --quiet && exit 0
          git commit -m "Update heraldry images (fetched by CI)"
          git pull --rebase origin main
          git push origin HEAD:main
